name: drill
services:
  postgres:
    extends: {file: compose.external.yml, service: postgres}
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["media:/data"]
  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-drill}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'until mc alias set drill http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing "drill/$$S3_BUCKET" && mc anonymous set none "drill/$$S3_BUCKET"'
  server:
    extends: {file: compose.external.yml, service: server}
    depends_on:
      storage-init: {condition: service_completed_successfully}
    environment:
      # Legacy local-MinIO entrypoint keeps its internal Docker address.
      # Use compose.external.yml for COS/S3/R2 or an existing storage service.
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  embedding:
    extends: {file: compose.external.yml, service: embedding}
volumes:
  pg-data:
  media:
  models:
