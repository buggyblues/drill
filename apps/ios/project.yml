name: Drill
options:
  bundleIdPrefix: local.drill
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Drill:
    type: application
    platform: iOS
    sources: [Drill]
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Drill
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "只有点击录音时才使用麦克风，录音首先保存在本机。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.drill.ios
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
